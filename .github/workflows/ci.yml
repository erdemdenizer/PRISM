# The full gate on the three systems Prism runs on (docs/TESTING.md, milestone 8). The Linux and
# macOS process-control code is verified only where these jobs have actually run and passed; the
# tests gated with @EnabledOnOs run on their own system only, and the test reports are kept as an
# artifact so that which ran and which were skipped can be read per system. The UI snapshot
# profile needs a display and the bundled fonts' rendering of one system, and stays a manual step
# on Windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes a running check of an older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Runner
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH, $(nproc 2>/dev/null || sysctl -n hw.ncpu) processors"
          uname -a
          java -version
      - name: Full gate
        shell: bash
        run: ./mvnw -B verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

  # Milestone 10 (docs/TESTING.md, plan D24): a check of its own, apart from the gate above. It reads
  # the Windows test reports and passes only if every native-limit suite ran and none of its tests
  # was skipped, failed or ended in error. A skip (for example a runner whose processes are in a Job
  # Object) is "not validated", never a pass; it leaves the gate above as it is.
  native-validation:
    name: native-validation
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-reports-windows-latest
          path: windows-reports
      - name: Native suites ran and passed
        run: node .github/scripts/native-validation.mjs windows-reports

  # Milestone 12 (plan Rev 2.2 §8.2, S6): the Linux native suites on a real systemd user manager, on disposable
  # processes the test harness starts under it (systemd-run --user --scope, test infrastructure only). The suites skip
  # themselves unless -Dprism.linux.native.required=true asks for them; here a missing capability fails them, and the
  # check below passes only if every test of both suites ran and passed (a skip is not a pass). The product never adopts
  # a process: Linux native limits stay unavailable to desktop applications (K16).
  linux-native-validation:
    name: linux-native-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Runner and user manager
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          id; uname -a; nproc; free -m; swapon --show || true
          systemctl --user --version | head -1 || true
          systemctl --user show -p Version -p ControlGroup || true
          cat /proc/self/cgroup
      - name: Linux native suites
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          ./mvnw -B -Dprism.linux.native.required=true \
            -Dtest='LinuxNativeLimitIntegrationTest,SystemdReadOnlySmokeTest' -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux-native
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Every Linux native test ran and passed
        if: always()
        run: node .github/scripts/linux-native-validation.mjs target/surefire-reports
      - name: No Prism scope left behind
        if: always()
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          left="$(systemctl --user list-units --all --plain --no-legend 'prism-srm-limit-*' || true)"
          echo "${left:-none}"
          sleep 3
          left="$(systemctl --user list-units --all --plain --no-legend 'prism-srm-limit-*' | grep -v '^$' || true)"
          test -z "$left"
