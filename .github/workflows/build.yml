# Builds portable distributables of PRISM:
#   1. PRISM-Portable-JAR: Single executable fat JAR (prism-portable.jar) + demo JAR + fast-start AppCDS launcher
#   2. PRISM-Windows-Portable-AppImage: Standalone Windows app-image (PRISM.exe + bundled minimal JRE)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-jar:
    name: build-portable-jar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build optimized portable Fat-JAR
        shell: bash
        run: |
          ./mvnw -B -Pportable-jar -DskipTests package
          mkdir -p dist/PRISM-Portable
          cp target/prism-portable.jar dist/PRISM-Portable/prism-portable.jar
          cp target/prism-*-demo.jar dist/PRISM-Portable/prism-demo.jar
          cat << 'EOF' > dist/PRISM-Portable/start-prism.bat
          @echo off
          setlocal
          cd /d "%~dp0"
          set "JVM_FAST_FLAGS=--enable-native-access=ALL-UNNAMED -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseG1GC -Xms64m -Xmx512m"
          if exist "prism-appcds.jsa" (
              start "" javaw %JVM_FAST_FLAGS% -XX:SharedArchiveFile=prism-appcds.jsa -jar prism-portable.jar
          ) else (
              start "" javaw %JVM_FAST_FLAGS% -XX:ArchiveClassesAtExit=prism-appcds.jsa -jar prism-portable.jar
          )
          EOF
          cat << 'EOF' > dist/PRISM-Portable/start-prism.sh
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          JVM_FAST_FLAGS="--enable-native-access=ALL-UNNAMED -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseG1GC -Xms64m -Xmx512m"
          if [ -f "prism-appcds.jsa" ]; then
            exec java $JVM_FAST_FLAGS -XX:SharedArchiveFile=prism-appcds.jsa -jar prism-portable.jar "$@"
          else
            exec java $JVM_FAST_FLAGS -XX:ArchiveClassesAtExit=prism-appcds.jsa -jar prism-portable.jar "$@"
          fi
          EOF
          chmod +x dist/PRISM-Portable/start-prism.sh
      - name: Upload Portable JAR Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Portable-JAR-${{ matrix.os }}
          path: dist/PRISM-Portable/
          retention-days: 30

  windows-portable-exe:
    name: build-windows-portable-exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build Windows App-Image & Portable ZIP (PRISM.exe)
        shell: bash
        run: ./mvnw -B -Ppackage-image -Dprism.package.unverifiedJdk=true -DskipTests package
      - name: Upload Windows Portable EXE Image
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Windows-Portable-EXE
          path: target/package/*.zip
          retention-days: 30

  # ADR-0018: the Linux application image, built on Linux (DEL-1). Kept as an artifact, not
  # verified here: verify-image.sh needs a desktop session.
  linux-app-image:
    name: build-linux-app-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build the Linux application image and its tar.gz
        shell: bash
        run: ./mvnw -B -Ppackage-image-linux -DskipTests package
      - name: Upload the Linux image and its verification kit
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Linux-x64-image
          path: |
            target/package/*.tar.gz
            target/package/*.tar.gz.sha256
            target/package/BUILT_WITH.txt
            target/package/verification/
          retention-days: 30
